name = "focal-expensi"
main = "worker/index.ts"
compatibility_date = "2025-10-04"
compatibility_flags = ["nodejs_compat"]

# Serve frontend assets (production only)
# For local development, Vite serves the frontend on port 3000
[assets]
directory = "./dist"
binding = "ASSETS"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "focal_expensi_db"
database_id = "85a073b1-3c48-4a21-bf35-68e7c473d654"

# Environment variables (use wrangler secrets for production)
[vars]
NODE_ENV = "production"
AI_PROVIDER = "gemini"  # Active options: 'gemini' | 'nvidia' | 'groq'

# Production secrets (set using wrangler secret put):
# JWT_SECRET - Secret key for JWT token signing
# ENCRYPTION_KEY - Key for encrypting sensitive data in database
# BREVO_API_KEY - (Optional) Brevo API key for sending transactional emails
# APP_URL - (Optional) Application URL for email verification links (e.g., https://focal-expense.app)
# ADMIN_EMAIL - (Optional) Email address for admin access (e.g., admin@example.com)
#
# AI Provider Secrets (configure keys for all enabled providers):
# GEMINI_API_KEY - Google Gemini API key (default model: gemini-2.5-flash; also used for audio)
# GEMINI_API_KEY_2 - (Optional) Fallback Gemini API key
# NVIDIA_API_KEY - Nvidia NIM API key (default model: nvidia/nemotron-3.5-super-vl-120b-a12b)
# NVIDIA_API_KEY_2 - (Optional) Fallback Nvidia API key
# GROQ_API_KEY - Groq API key (default model: qwen/qwen3.8-27b direct vision)
# GROQ_API_KEY_2 - (Optional) Fallback Groq API key
# AI_MODEL - (Optional) Override default model for the active provider
#
# OpenAI-Compatible Provider (wired for OpenRouter, currently unused in UI/handlers):
# OPENAI_COMP_API_KEY - (Optional) OpenAI-compatible API key (e.g. OpenRouter)
# OPENAI_COMP_API_KEY_2 - (Optional) Fallback OpenAI-compatible API key
# OPENAI_COMP_BASE_URL - (Optional) Base URL override (defaults to https://openrouter.ai/api/v1)
# OPENAI_COMP_MODEL - (Optional) Model override (defaults to openrouter/free)

[observability]
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true